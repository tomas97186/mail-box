<div class="background d-flex justify-content-center align-items-center vh-100 w-100">
    <div class="card p-4 shadow-lg" style="width: 380px; border-radius: 12px;">
        <div class="text-center mb-4">
            <img src="assets/logo.png" alt="Pmail Logo" style="width: 200px;">
        </div>
        <form (ngSubmit)="onSubmit()">
            @if(suggestion === 'error') {
            <div class="alert alert-danger text-center" role="alert">
                Non è stato impostato un suggerimento password.
            </div>

            } @else if (suggestion) {
            <div class="alert alert-info text-center" role="alert">
                Suggerimento password:<br> {{ suggestion }}
            </div>}
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Richiedi password</button>
            <div class="mt-3 text-center">
                <a routerLink="/login" class="text-danger">Torna al Login</a>
            </div>
        </form>
    </div>
</div>
