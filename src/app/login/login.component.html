<div class="background d-flex justify-content-center align-items-center vh-100 w-100">
    <div class="card p-4 shadow-lg" style="width: 380px; border-radius: 12px;">
        <div class="text-center mb-4">
            <img src="assets/logo.png" alt="Pmail Logo" style="width: 200px;">
        </div>
        <form (ngSubmit)="onSubmit()">
            @if(errorMessage) {
            <div class="alert alert-danger text-center" role="alert">
                {{ errorMessage }}
            </div>

            }
            <div class="mb-3">
                <label for="username" class="form-label">Email</label>
                <input type="text" id="username" class="form-control" [(ngModel)]="username" name="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" [(ngModel)]="password" name="password"
                    required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Login</button>
        </form>
    </div>
</div>
